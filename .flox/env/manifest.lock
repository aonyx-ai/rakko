    "vars": {
      "TRACEY_REV": "7494469c454ea3e93203f2cc860adbf153fe64b9"
    },
    "hook": {
      "on-activate": "# On GitHub Actions, we need to unset the LD_AUDIT variable to avoid an \"cannot\n# allocate memory in static TLS block\" error when loading Rust. See this issue:\n# https://github.com/flox/flox/issues/1341\nif [ -n \"$GITHUB_ACTIONS\" ]; then\n  unset LD_AUDIT\nfi\n\n# Install tracey from source, once per revision and per machine. The binary is\n# put in the user's cache directory instead of the project, so that clones,\n# worktrees, and CI jobs on the same machine share one build. The build takes\n# several minutes the first time. Set RAKKO_SKIP_TRACEY to a non-empty value\n# to skip the installation, for example in CI jobs that do not run tracey.\ntracey_root=\"${XDG_CACHE_HOME:-$HOME/.cache}/rakko/tracey/$TRACEY_REV\"\nif [ -z \"${RAKKO_SKIP_TRACEY:-}\" ] && [ ! -x \"$tracey_root/bin/tracey\" ]; then\n  if command -v node >/dev/null && command -v pnpm >/dev/null; then\n    echo \"Installing tracey ${TRACEY_REV:0:12} from source, this takes several minutes...\" >&2\n    mkdir -p \"$(dirname \"$tracey_root\")\"\n    tracey_tmp=\"$(mktemp -d \"$(dirname \"$tracey_root\")/tmp.XXXXXX\")\"\n    # Build from the project directory, so that rustup picks up the toolchain\n    # from rust-toolchain.toml. Build into a temporary directory and move only\n    # the binary into place afterwards, so that a failed build never leaves a\n    # half-installed tracey behind. Moving a single file is an atomic rename.\n    # If two activations build the same revision at the same time, the second\n    # move replaces the binary with an identical one.\n    if (cd \"$FLOX_ENV_PROJECT\" && cargo install --git https://github.com/bearcove/tracey --rev \"$TRACEY_REV\" --locked --root \"$tracey_tmp\" tracey); then\n      mkdir -p \"$tracey_root/bin\"\n      mv \"$tracey_tmp/bin/tracey\" \"$tracey_root/bin/tracey\"\n    else\n      echo \"error: failed to install tracey, see the output above\" >&2\n    fi\n    rm -rf \"$tracey_tmp\"\n  else\n    echo \"warning: tracey is not installed because node or pnpm is not available on this system\" >&2\n  fi\nfi\nexport PATH=\"$tracey_root/bin:$PATH\"\n"
    },
    "profile": {},
    "options": {}
  },
