# Flox manifest version managed by Flox CLI
schema-version = "1.12.0"

[install]
# Rustup installs rustc, cargo, clippy, rust-analyzer, and rustfmt
rustup.pkg-path = "rustup"

# The standard library links against this package on macOS.
libiconv.pkg-path = "libiconv"
libiconv.systems = ["aarch64-darwin", "x86_64-darwin"]
libiconv.outputs = "all"

# This package provides the source code for the standard library, which is used
# by rust-analyzer below to provide diagnostics and documentation.
rust-lib-src.pkg-group = "rust-toolchain"
rust-lib-src.pkg-path = "rustPlatform.rustLibSrc"

# We install gcc and clang as linkers for Rust.
clang.pkg-path = "clang"
clang.systems = ["aarch64-darwin", "x86_64-darwin"]
gcc.pkg-path = "gcc"
gcc.systems = ["aarch64-linux", "x86_64-linux"]
gcc.outputs = "all"

# Development tools for the Rust ecosystem
cargo-deny.pkg-path = "cargo-deny"
cargo-llvm-cov.pkg-path = "cargo-llvm-cov"
cargo-nextest.pkg-path = "cargo-nextest"
cargo-udeps.pkg-path = "cargo-udeps"

# Local development tools
git.pkg-path = "git"
git.outputs = "all"
jq.pkg-path = "jq"
just.pkg-path = "just"
just.outputs = "all"
markdownlint-cli.pkg-path = "markdownlint-cli"
parallel.pkg-path = "parallel"
parallel.outputs = "all"
pre-commit.pkg-path = "pre-commit"
pre-commit.outputs = "all"
prettier.pkg-path = "prettier"
taplo.pkg-path = "taplo"
yamllint.pkg-path = "yamllint"
yamllint.outputs = "all"
zizmor.pkg-path = "zizmor"

# Build dependencies for tracey, which the hook below installs from source. The
# build script of tracey bundles a web dashboard with node and pnpm. Neither
# package is available for x86_64-darwin, so tracey is not installed there.
nodejs.pkg-path = "nodejs_22"
nodejs.systems = ["aarch64-darwin", "aarch64-linux", "x86_64-linux"]
pnpm.pkg-path = "pnpm"
pnpm.systems = ["aarch64-darwin", "aarch64-linux", "x86_64-linux"]

[vars]
# The Git revision of tracey that the hook below installs. The releases of
# tracey lag behind its main branch, so we build a pinned revision from source.
# Change the revision deliberately: main is a 2.0 release candidate, and its
# configuration format can still change.
TRACEY_REV = "7494469c454ea3e93203f2cc860adbf153fe64b9"

[hook]
on-activate = '''
# On GitHub Actions, we need to unset the LD_AUDIT variable to avoid an "cannot
# allocate memory in static TLS block" error when loading Rust. See this issue:
# https://github.com/flox/flox/issues/1341
if [ -n "$GITHUB_ACTIONS" ]; then
  unset LD_AUDIT
fi

# Install tracey from source, once per revision and per machine. The binary is
# put in the user's cache directory instead of the project, so that clones,
# worktrees, and CI jobs on the same machine share one build. The build takes
# several minutes the first time. Set RAKKO_SKIP_TRACEY to a non-empty value
# to skip the installation, for example in CI jobs that do not run tracey.
tracey_root="${XDG_CACHE_HOME:-$HOME/.cache}/rakko/tracey/$TRACEY_REV"
if [ -z "${RAKKO_SKIP_TRACEY:-}" ] && [ ! -x "$tracey_root/bin/tracey" ]; then
  if command -v node >/dev/null && command -v pnpm >/dev/null; then
    echo "Installing tracey ${TRACEY_REV:0:12} from source, this takes several minutes..." >&2
    mkdir -p "$(dirname "$tracey_root")"
    tracey_tmp="$(mktemp -d "$(dirname "$tracey_root")/tmp.XXXXXX")"
    # Build from the project directory, so that rustup picks up the toolchain
    # from rust-toolchain.toml. Build into a temporary directory and move only
    # the binary into place afterwards, so that a failed build never leaves a
    # half-installed tracey behind. Moving a single file is an atomic rename.
    # If two activations build the same revision at the same time, the second
    # move replaces the binary with an identical one.
    if (cd "$FLOX_ENV_PROJECT" && cargo install --git https://github.com/bearcove/tracey --rev "$TRACEY_REV" --locked --root "$tracey_tmp" tracey); then
      mkdir -p "$tracey_root/bin"
      mv "$tracey_tmp/bin/tracey" "$tracey_root/bin/tracey"
    else
      echo "error: failed to install tracey, see the output above" >&2
    fi
    rm -rf "$tracey_tmp"
  else
    echo "warning: tracey is not installed because node or pnpm is not available on this system" >&2
  fi
fi
export PATH="$tracey_root/bin:$PATH"
'''

[profile]

[services]

[include]

[build]

[options]
