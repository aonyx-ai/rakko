# This file pins the version of Otto that the action of this crate runs. The
# crate embeds the file when it compiles, so the pin and the code that reads
# the list of release units change together. Mise reads the file only with
# `MISE_ENV=rakko`. Otto publishes no prebuilt binary, so mise builds it from
# source. No job of a project releases on Windows, so the pin leaves Windows
# out, and the action skips there.
[tools]
"cargo:otto" = { version = "0.3.0", os = ["linux", "macos"] }
