# This file pins the version of stiles that the action of this crate runs.
# The crate embeds the file when it compiles, so the pin and the code that
# reads the reports of stiles change together. Mise reads the file only with
# `MISE_ENV=rakko`. Stiles puts the name of the tool in the tag of each
# release, such as `stiles@0.6.0`. So the pin gives the tag as its version.
# Stiles publishes builds only for Linux and for macOS on ARM, so the pin lists
# those platforms.
[tools]
"github:aonyx-ai/stiles" = { version = "stiles@0.6.0", os = ["linux", "macos/arm64"] }
