<!doctype html>
<html lang="{{ lang }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#ffffff" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#16171a" media="(prefers-color-scheme: dark)">
  <title>{% block title %}{{ config.title }}{% endblock title %}</title>
  <meta name="description" content="{% block description %}{{ config.description }}{% endblock description %}">
  <link rel="stylesheet" href="{{ get_url(path='style.css', cachebust=true) }}">
</head>
<body>
  <a class="skip" href="#text">Skip to Content</a>
  <header class="topbar">
    <div class="topbar-inner">
      <a class="wordmark" href="{{ get_url(path='@/_index.md') }}">Rakko</a>
      <nav class="topnav" aria-label="Site">
        {%- block topnav_extra %}{% endblock topnav_extra %}
        <a class="topnav-start" href="{{ get_url(path='@/tutorial/get-started.md') }}">Get Started</a>
        <a href="{{ get_url(path='@/how-to/_index.md') }}">Guides</a>
        <a href="{{ get_url(path='@/explanation/_index.md') }}">Concepts</a>
        <a href="{{ get_url(path='@/reference/crates.md') }}">Reference</a>
        <a class="topnav-icon" href="https://github.com/aonyx-ai/rakko" aria-label="Rakko on GitHub">
          <svg viewBox="0 0 16 16" width="20" height="20" aria-hidden="true"><path fill="currentColor" d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.013 8.013 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
        </a>
      </nav>
    </div>
  </header>
  {% block body %}{% endblock body %}
  <footer class="footer">
    <div class="footer-inner">
      <a class="maker" href="https://aonyx.ai">
        <img src="{{ get_url(path='aonyx-logo.png') }}" width="40" height="40" alt="">
        <span>Rakko is built by Aonyx</span>
      </a>
      <p>Rakko is licensed under MIT or Apache 2.0. Its source code is on <a href="https://github.com/aonyx-ai/rakko">GitHub</a>.</p>
    </div>
  </footer>
</body>
</html>
