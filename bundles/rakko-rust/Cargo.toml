[package]
name = "rakko-rust"
version = "0.1.0"
description = "The core Rakko bundle for Rust, which the library and binary bundles contain"
edition.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true

[dependencies]
rakko = { workspace = true }
rakko-build-internal-docs = { path = "../../actions/rakko-build-internal-docs", version = "0.1.0" }
rakko-check-dependencies = { path = "../../actions/rakko-check-dependencies", version = "0.1.0" }
rakko-check-latest-deps = { path = "../../actions/rakko-check-latest-deps", version = "0.1.0" }
rakko-check-unused-deps = { path = "../../actions/rakko-check-unused-deps", version = "0.1.0" }
rakko-format-rust = { workspace = true }
rakko-lint-rust = { workspace = true }
rakko-lint-stiles = { path = "../../actions/rakko-lint-stiles", version = "0.1.0" }
rakko-test-rust = { workspace = true }

[lints]
workspace = true
