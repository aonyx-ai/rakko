# Mise provisions every external tool that this repository needs, at the
# versions that this file pins. ADR-003 records the decision.

[tools]
# Mise builds a tool of the cargo backend from source, unless cargo-binstall is
# available. With cargo-binstall, it downloads a prebuilt binary instead.
cargo-binstall = "1.22.0"

# Prettier runs on node, and mise puts no node on the path for a tool of its
# npm backend, so the pin below is what lets the format actions start prettier.
# The build script of tracey bundles a web dashboard with node and pnpm, and
# the `install-tracey` task below is the only consumer of the second pin.
node = "24.20.0"
pnpm = "11.25.0"

# The first toolchain is the default for builds, Clippy, and the tests. The
# second is the nightly channel, which rustfmt needs for the unstable options
# in `.rustfmt.toml`. Mise resolves the channel to a dated toolchain and
# records it in `mise.lock`, so every machine and every job format with the
# same nightly, and `mise lock --bump` advances it. Mise installs both through
# rustup, so `rustup run` still reaches the toolchains that the remaining
# justfile recipes install themselves. The `rust-src` component carries the
# source of the standard library, which rust-analyzer reads.
rust = [
  { version = "1.98.0", components = [
    "clippy",
    "rust-src",
    "rustfmt",
  ] },
  { version = "nightly", components = [
    "rustfmt",
  ] },
]

"cargo:cargo-deny" = "0.20.2"
"cargo:cargo-nextest" = "0.9.143"
"cargo:cargo-udeps" = "0.1.61"
jq = "1.8.2"
just = "1.58.0"
"npm:markdownlint-cli" = "0.49.1"
pre-commit = "4.6.2"
"npm:prettier" = "3.9.6"
taplo = "0.10.0"
yamllint = "1.38.0"
zizmor = "1.30.0"

[settings]
# The lockfile records the version that each pin resolved to, which matters
# for the nightly toolchain: the pin names a channel, and the lockfile names
# the day.
lockfile = true

[vars]
# The Git revision of tracey that the task below builds. The releases of tracey
# lag behind its main branch, so a pinned revision is built from source. Change
# the revision deliberately: main is a 2.0 release candidate, and its
# configuration format can still change.
tracey_rev = "7494469c454ea3e93203f2cc860adbf153fe64b9"

[env]
# The first directory is where the task below installs tracey. The path carries
# the revision, so a new pin asks for a new build and leaves the old binary
# alone. The second holds `rakko`, the shortcut that runs the harness.
_.path = [
  "{{ xdg_cache_home }}/rakko/tracey/{{ vars.tracey_rev }}/bin",
  "{{ config_root }}/tools/bin",
]

[hooks]
# `mise install` provisions the tools above, downloads the toolchains that it
# only recorded, and then builds the one tool that no mise backend can
# install.
postinstall = "mise run install-toolchains && mise run install-tracey"

[tasks.install-toolchains]
description = "Download every pinned Rust toolchain that rustup is missing"
# The default shell of a task is `sh`, which is dash on Debian and Ubuntu, and
# dash has no `pipefail`.
shell = "bash -c"
# Mise installs a Rust toolchain through rustup, and it records the install as
# a symlink to the shared cargo directory. That symlink is what mise reads
# afterwards, so a machine that carries the symlink without the toolchain
# behind it reports the toolchain as installed while rustup has never
# downloaded it. A cache that holds the mise directory and not the rustup home
# is the usual way to get there. Whatever selects such a toolchain first
# downloads it, and two commands that select it at once ruin each other's
# download.
#
# This task closes that gap, so that every toolchain the project pins is on
# the machine before anything asks for it. It looks only at the toolchains
# that mise reports as installed, because a toolchain that mise has not
# installed is still mise's to install, and a run that provisions nothing Rust
# then downloads nothing either. It calls rustup instead of mise, because mise
# runs this task while `mise install` still holds its own lock. The profile is
# the one that rustup is configured with, which carries the components that
# the checks of this repository need.
run = '''
set -euo pipefail

for toolchain in $(mise ls --current --json rust | jq -r '.[] | select(.installed) | .version'); do
    if rustup toolchain list | grep -q "^${toolchain}-"; then
        continue
    fi

    echo "Downloading the ${toolchain} toolchain..." >&2
    rustup toolchain install "${toolchain}" --no-self-update
done
'''

[tasks.install-tracey]
description = "Build tracey from the pinned revision"
# The default shell of a task is `sh`, which is dash on Debian and Ubuntu, and
# dash has no `pipefail`.
shell = "bash -c"
# The task runs inside the mise environment, so the build finds node, pnpm, and
# the pinned Rust toolchain.
run = '''
set -euo pipefail

# The binary goes into the cache directory of the user instead of the project,
# so that clones, worktrees, and CI jobs on the same machine share one build.
# The build takes several minutes. Set RAKKO_SKIP_TRACEY to a non-empty value
# to skip it, for example in a CI job that does not call tracey.
root="{{ xdg_cache_home }}/rakko/tracey/{{ vars.tracey_rev }}"
if [ -n "${RAKKO_SKIP_TRACEY:-}" ] || [ -x "$root/bin/tracey" ]; then
    exit 0
fi

echo "Building tracey {{ vars.tracey_rev }}, this takes several minutes..." >&2

# Build into a temporary directory and move only the binary into place
# afterwards, so that a failed build never leaves a half-installed tracey
# behind. Moving a single file is an atomic rename, and two builds of the same
# revision at the same time replace the binary with an identical one.
mkdir -p "$(dirname "$root")"
tmp="$(mktemp -d "$(dirname "$root")/tmp.XXXXXX")"
trap 'rm -rf "$tmp"' EXIT

cargo install --git https://github.com/bearcove/tracey --rev "{{ vars.tracey_rev }}" --locked --root "$tmp" tracey

mkdir -p "$root/bin"
mv "$tmp/bin/tracey" "$root/bin/tracey"
'''

[tasks.rakko]
description = "Run the maintenance actions of this repository"
# `raw_args` hands every argument to the harness untouched, so that a flag such
# as `--help` reaches the harness instead of being read by mise.
raw_args = true
run = 'cargo run --quiet --manifest-path "{{ config_root }}/tools/rakko/Cargo.toml" --'
