# Mise provisions every external tool that this repository needs. This file
# pins the toolchains and the tools that no action declares. The actions pin
# their own tools, and `mise run rakko -- doctor --fix` writes those pins into
# `.config/mise/conf.d/rakko.toml` and locks them in `.config/mise/mise.lock`.
# Mise merges that file with this one. ADR-003 and ADR-021 record the
# decision.

[tools]
# Mise builds a tool of the cargo backend from source, unless cargo-binstall is
# available. With cargo-binstall, it downloads a prebuilt binary instead.
cargo-binstall = "1.26.2"

# Prettier, markdownlint-cli, oxfmt, tsc, and the validator of Renovate all run
# on node. Mise puts no node on the path for a tool of its npm backend. Node is
# a toolchain of this repository. So the actions that wrap these tools read
# this pin, and each runs its tool on it. `test-typescript` runs the tests on
# it. Each of them accepts a range of versions, and the pin must be in every
# range:
#
# - tsc: 12.20 and later
# - prettier: 14 and later
# - markdownlint-cli: 22 and later
# - oxfmt: `^20.19.0 || >=22.12.0`
# - the tests of `test-typescript`: `^22.18 || >=23.6`
# - Renovate: `^24.11.0 || ^26.13.0`
node = "26.13.0"

# The first toolchain is the default for builds, Clippy, and the tests. The
# second is a nightly toolchain, which rustfmt needs for the unstable options
# in `.rustfmt.toml`, and which cargo-udeps needs for the unstable option that
# records the crates a target loaded. The pin names the nightly by its date,
# so every machine and every job format with the same nightly. A pin of the
# bare channel cannot promise that. Mise links each Rust toolchain that it
# installs to the directory of rustup, and it takes such a link for a
# toolchain that a user linked by hand. It then ignores `mise.lock` for Rust,
# and the channel resolves to the newest nightly that the machine holds, or
# that rustup offers during an install. Renovate moves the date forward once a
# week, and it changes `mise.lock` in the same pull request, because an
# install with `--locked` refuses a pin that the lockfile does not hold. The
# third is the oldest toolchain that the crates promise to compile on, and
# `check-msrv` runs the compiler on it. That pin repeats the `rust-version` of
# the root `Cargo.toml`, because the action reads the version from the
# manifest and then asks mise for the toolchain, and Rakko installs nothing. A
# pin that stops agreeing with the manifest therefore fails the check instead
# of moving it. Mise installs all three through rustup, so an action that
# names a toolchain reaches it through the proxy of rustup. The `rust-src`
# component carries the source of the standard library, which rust-analyzer
# reads.
rust = [
  { version = "1.99.1", components = [
    "clippy",
    "rust-src",
    "rustfmt",
  ] },
  { version = "nightly-2026-11-08", components = [
    "rustfmt",
  ] },
  { version = "1.88.0" },
]

jq = "1.8.2"
# The release of pre-commit is a Python zipapp, and the registry maps that
# file to no Windows download, so the pin names the backend that installs
# from the package index instead and works on every platform.
"pipx:pre-commit" = "4.7.0"
# Mise installs pre-commit above and the yamllint of `lint-yaml` from the
# package index of Python, with uv. No action runs uv or Python itself. For
# each of the two tools, mise writes a uv lock file that records the version
# of every package that the tool depends on. Mise calls this record a
# dependency graph. It keeps the graph in `.mise/locks/` beside `mise.lock`,
# or in `.config/mise/locks/`, and the lockfile refers to it. `mise install
# --locked` refuses such a tool without its graph. Not every machine has a uv
# that works, so the first pin supplies one.
#
# An install from a graph uses only prebuilt packages, which Python calls
# wheels. The graph of pre-commit needs Python 3.11 or later. pyyaml 6.0.3
# has no wheel for Python 3.15 or later. The Python of a machine can be
# newer, such as the Python 3.15 of the macOS runner of CI. So the second pin
# supplies a Python that both tools can use.
uv = "0.13.7"
python = "3.14.8"
# TypeScript is a toolchain of this repository, like node. `check-typescript`
# reads this pin, and it accepts TypeScript 5 and later.
"npm:typescript" = "7.0.2"

[settings]
# The lockfile records the version that each pin resolved to, and for a tool
# that mise downloads, the address and the checksum of the file for each
# platform, so every machine installs the same bytes.
lockfile = true

# `mise lock` records the tools for these platforms. Every job of CI runs on
# `linux-x64`, the jobs that run the tests also run on `macos-arm64` and
# `windows-x64`, and the machines of the contributors run on `macos-arm64`.
# Renovate locks on `linux-x64` as well, when it moves a pin. CI installs in
# locked mode, which fails on a platform that the lockfile does not record. So
# before a job of CI runs on a new platform, add the platform here and run
# `mise lock`. A tool without a build for a platform of the list gets no entry
# for that platform, and `mise lock` does not fail.
#
# `mise lock` also writes the entries of the platform of the machine that runs
# it, and it removes the entries of every other platform. A machine that locks
# on a platform outside the list therefore writes entries that the next run
# in CI removes again, and `check-mise-lock` reports each of them.
lockfile_platforms = ["linux-x64", "macos-arm64", "windows-x64"]

# The installer that mise carries lays a package of npm out the way pnpm
# does: one directory per package, and a link from every package to each of
# its dependencies. Windows creates such a link only for an account that may,
# so a tool that reads a dependency of its own finds none of them there. The
# npm that ships with node writes one directory that holds every package
# instead, which needs no link, so the setting hands the install to it.
npm.shell_out = true

[env]
# The directory holds the stubs that `mise generate task-stubs` writes, one per
# task, so that `rakko` runs the harness wherever mise supplies its
# environment. Mise writes the stubs once and never touches them again, so a
# change to the tasks below wants a fresh run of the generator.
_.path = ["{{ config_root }}/bin"]

[hooks]
# `mise install` provisions the tools above and then downloads the toolchains
# that it only recorded.
#
# The hook starts mise again, and that second mise provisions before it runs a
# task. It would then install a tool that the first one has just written and
# has yet to record, and the installer of a tool refuses to overwrite what is
# already there. The flag stops that provisioning, so the hook only runs the
# task. It is a flag and not a variable in front of the command, because a
# variable in front of a command is syntax of a shell of Unix, and the shell
# that mise starts a hook with on Windows reads it as the name of a program.
postinstall = "mise run --skip-tools install-toolchains"

[tasks.install-toolchains]
description = "Download every pinned Rust toolchain that rustup is missing"
# The default shell of a task is `sh`, which is dash on Debian and Ubuntu, and
# dash has no `pipefail`.
shell = "bash -c"
# Mise installs a Rust toolchain through rustup, and it records the install as
# a symlink to the shared cargo directory. That symlink is what mise reads
# afterwards, so a machine that carries the symlink without the toolchain
# behind it reports the toolchain as installed while rustup has never
# downloaded it. A cache that holds the mise directory and not the rustup home
# is the usual way to get there. Whatever selects such a toolchain first
# downloads it, and two commands that select it at once ruin each other's
# download.
#
# This task closes that gap, so that every toolchain the project pins is on
# the machine before anything asks for it. It looks only at the toolchains
# that mise reports as installed, because a toolchain that mise has not
# installed is still mise's to install, and a run that provisions nothing Rust
# then downloads nothing either. It calls rustup instead of mise, because mise
# runs this task while `mise install` still holds its own lock. The profile is
# the one that rustup is configured with, which carries the components that
# the checks of this repository need.
#
# The question to mise only reads, so it provisions nothing while the install
# that reached this task still holds the lock of mise.
#
# The jq of Windows writes its standard output in the text mode of the
# platform, which ends every line with two characters. The loop splits the
# answer at the second of them, so without the removal each name of a
# toolchain would carry the first one, and rustup would refuse the name.
run = '''
set -euo pipefail

for toolchain in $(mise ls --current --json rust | jq -r '.[] | select(.installed) | .version' | tr -d '\r'); do
    if rustup toolchain list | grep -q "^${toolchain}-"; then
        continue
    fi

    echo "Downloading the ${toolchain} toolchain..." >&2
    rustup toolchain install "${toolchain}" --no-self-update
done
'''

[tasks.rakko]
description = "Run the maintenance actions of this repository"
# `raw_args` hands every argument to the harness untouched, so that a flag such
# as `--help` reaches the harness instead of being read by mise.
raw_args = true
run = 'cargo run --quiet --manifest-path "{{ config_root }}/tools/rakko/Cargo.toml" --'
