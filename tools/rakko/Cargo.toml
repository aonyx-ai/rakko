[workspace]

[package]
name = "harness"
version = "0.1.0"
edition = "2024"
publish = false

# The binary is named `rakko`, so that it reads well on the command line.
[[bin]]
name = "rakko"
path = "src/main.rs"

[dependencies]
getset = ">=0.1,<1"
rakko-action = { path = "../../crates/rakko-action" }
rakko-build-internal-docs = { path = "../../actions/rakko-build-internal-docs" }
rakko-check-dependencies = { path = "../../actions/rakko-check-dependencies" }
rakko-check-latest-deps = { path = "../../actions/rakko-check-latest-deps" }
rakko-check-minimal-deps = { path = "../../actions/rakko-check-minimal-deps" }
rakko-check-msrv = { path = "../../actions/rakko-check-msrv" }
rakko-check-specs = { path = "../../actions/rakko-check-specs" }
rakko-check-unused-deps = { path = "../../actions/rakko-check-unused-deps" }
rakko-cli = { path = "../../crates/rakko-cli" }
rakko-format-json = { path = "../../actions/rakko-format-json" }
rakko-format-markdown = { path = "../../actions/rakko-format-markdown" }
rakko-format-rust = { path = "../../actions/rakko-format-rust" }
rakko-format-toml = { path = "../../actions/rakko-format-toml" }
rakko-format-yaml = { path = "../../actions/rakko-format-yaml" }
rakko-lint-github-actions = { path = "../../actions/rakko-lint-github-actions" }
rakko-lint-markdown = { path = "../../actions/rakko-lint-markdown" }
rakko-lint-rust = { path = "../../actions/rakko-lint-rust" }
rakko-lint-toml = { path = "../../actions/rakko-lint-toml" }
rakko-lint-yaml = { path = "../../actions/rakko-lint-yaml" }
rakko-test-rust = { path = "../../actions/rakko-test-rust" }
rakko-test-rust-docs = { path = "../../actions/rakko-test-rust-docs" }
thiserror = "2"

[workspace.lints.clippy]
# Require documentation on private items as well, since that helps with long-term maintainability.
missing_docs_in_private_items = "warn"

# Require errors, panics, and unsafe code to be documented.
missing_errors_doc = "warn"
missing_panics_doc = "warn"
missing_safety_doc = "warn"
unnecessary_safety_doc = "warn"

# `unwrap` and `expect` can cause panics, which is why we ban them from production code.
expect_used = "warn"
unwrap_used = "warn"

# Forbid printing anything to stdout or stderr.
print_stderr = "warn"
print_stdout = "warn"

# Prefer `mod.rs` over `name.rs` so that every module is a self-contained unit.
self_named_module_files = "warn"

[workspace.lints.rust]
# Detect explicit lifetime requirements that the compiler can infer.
explicit_outlives_requirements = "deny"

# Types must implement or derive `Debug` so that they can be easily debugged.
missing_debug_implementations = "deny"

# Require documentation for all public items
missing_docs = "deny"

# Public but unreachable items are likely a mistake.
unreachable_pub = "deny"

# Unsafe code can lead to undefined behavior and security vulnerabilities.
unsafe_code = "deny"

[lints]
workspace = true
