[output]
# When outputting inclusion graphs in diagnostics that include features, this
# option can be used to specify the depth at which feature edges will be added.
# This option is included since the graphs can be quite large and the addition
# of features from the crate(s) to all of the graph roots can be far too verbose.
# This option can be overridden via `--feature-depth` on the cmd line
feature-depth = 1

[licenses]
# Rakko is published under Apache-2.0 OR MIT, and a dependency must not add a
# license that is stricter than these. Add a license here when a dependency
# needs it, and only when it is OSI- or FSF-approved.
allow = ["Apache-2.0", "MIT", "MPL-2.0", "Unicode-3.0"]

[bans]
# Two versions of one crate build and link both, which grows the binary and can
# split a type across the versions. It is a warning, because a duplicate often
# comes from a transitive dependency that the workspace cannot control.
multiple-versions = "warn"

# A wildcard requirement accepts any future release, including one with a
# breaking change, so a build that works today can break without a noticeable
# change here.
wildcards = "deny"
