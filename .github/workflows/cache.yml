---
name: Cache

# A pull request can restore a cache from its base branch, but a cache that a
# pull request creates stays with that pull request. The checks therefore need
# a run on main to put a cache where every pull request can reach it. This
# workflow is that run.
#
# GitHub removes a cache that nothing reads for seven days. The schedule below
# keeps the largest gap at four days, so a quiet week does not cost the next
# pull request the full build.
"on":
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1,4"
  workflow_dispatch:

permissions: {}

# A run builds tracey when the key misses, which takes about twenty minutes.
# Two runs at once would do that work twice, so a second run waits and then
# finds the cache warm.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  tracey:
    name: Build tracey
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore tracey
        uses: $/.github/actions/restore-tracey

      # Tracey stays out of this installation. Its build script bundles a web
      # dashboard with node and pnpm, and a tool of the cargo backend does not
      # see the other tools of mise while it builds: it finds whatever node the
      # runner carries and no pnpm at all.
      - name: Install the tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          # Without a pin the action installs the release that mise reports as
          # the newest one, and a release whose upload failed carries no file
          # to download. Renovate advances the pin, so a release that breaks
          # costs one revert instead of a red pull request.
          # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
          version: 2026.9.2
        env:
          MISE_DISABLE_TOOLS: cargo:https://github.com/bearcove/tracey

      # The build script of tracey starts node and pnpm by name, and it finds
      # neither through mise: a tool of the cargo backend builds without the
      # other tools of mise on its path, so the script reaches whatever node
      # the machine carries and no pnpm at all. The links put both on the path
      # under names that belong to no tool of mise, and the versions that they
      # print are the pins of this repository, so a wrong path stops the job
      # here instead of after the nine minutes that the dependencies take.
      - name: Build tracey
        env:
          MISE_DISABLE_TOOLS: ""
        run: |
          tools="${RUNNER_TEMP}/tracey-build-tools"
          mkdir -p "${tools}"
          ln -sf "$(mise where node)/bin/node" "${tools}/node"
          ln -sf "$(mise where pnpm)/pnpm" "${tools}/pnpm"
          export PATH="${tools}:${PATH}"

          node --version
          pnpm --version

          mise install "cargo:https://github.com/bearcove/tracey"

      # Print the revision, so a stale binary in the cache shows up here.
      - name: Show the version of tracey
        run: mise exec -- tracey --version
