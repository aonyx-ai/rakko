---
name: Cache

# A pull request can restore a cache from its base branch, but a cache that a
# pull request creates stays with that pull request. The checks therefore need
# a run on main to put a cache where every pull request can reach it. This
# workflow is that run.
#
# GitHub removes a cache that nothing reads for seven days. The schedule below
# keeps the largest gap at four days, so a quiet week does not cost the next
# pull request the full build.
"on":
  push:
    branches: [main]
  schedule:
    - cron: "0 4 * * 1,4"
  workflow_dispatch:

permissions: {}

# A run builds tracey when the key misses, which takes about twenty minutes.
# Two runs at once would do that work twice, so a second run waits and then
# finds the cache warm.
concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  tracey:
    name: Build tracey
    runs-on: ubuntu-latest

    permissions:
      contents: read

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Restore tracey
        uses: $/.github/actions/restore-tracey

      - name: Install the tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      # The installation ends in the task that builds tracey, but a failed task
      # is only a warning there. The task runs again here, where a failure
      # stops the job.
      - name: Build tracey
        run: mise run install-tracey

      # Print the revision, so a stale binary in the cache shows up here.
      - name: Show the version of tracey
        run: mise exec -- tracey --version
