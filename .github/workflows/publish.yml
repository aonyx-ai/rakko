---
name: Publish

# Each crate of this repository releases on its own. An owner runs
# `otto release` from the directory of the crate, and the run ends at the
# GitHub release. This workflow takes the crate of that release to crates.io.
# It triggers on `published` and not on `released`, because `released` never
# fires for a pre-release, and a pre-release reaches crates.io as well.
"on":
  release:
    types: [published]

permissions: {}

# Each tag publishes in its own group, so two releases do not wait for each
# other. A publish is never cancelled, because a cancel can stop it halfway. A
# re-run of the workflow finishes such a publish, since Otto skips a crate
# whose version crates.io already holds.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.release.tag_name }}
  cancel-in-progress: false

jobs:
  publish:
    name: crates.io
    runs-on: ubuntu-latest

    permissions:
      contents: read
      id-token: write # Required for trusted publishing

    steps:
      # On a release event, the checkout takes the commit of the tag that the
      # release gives, which is what the workflow publishes.
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The setup cleans the tree itself, and keeps the build output that
          # an earlier job left on a persistent self-hosted runner.
          clean: false
          persist-credentials: false

      # The setup installs Otto at the version that `mise.toml` pins.
      - name: Set up the tools
        uses: $/.github/actions/setup

      # A token for trusted publishing cannot create a crate, and it covers
      # only the crates whose trusted publisher exists when the token is
      # requested. So the placeholders come first. The secret is an API token
      # with the scopes `publish-new` and `trusted-publishing`, limited to the
      # crates whose names start with `rakko` or `aonyx-rakko`. Otto reads the
      # workflow to trust from `GITHUB_WORKFLOW_REF`, which GitHub sets, and
      # the crate to release from the tag. The tag reaches the script through
      # `TAG`, so that no text of the event reaches the script itself. Otto
      # asks GitHub through `gh` where the address of a moved repository
      # leads, and `gh` takes the token of the job from `GH_TOKEN`.
      - name: Create the placeholders
        env:
          CARGO_REGISTRY_TOKEN: ${{ secrets.CRATES_IO_PLACEHOLDER_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: otto --verbose create-placeholders --tag "$TAG"

      - name: Authenticate with crates.io
        id: auth
        uses: rust-lang/crates-io-auth-action@3268eb413133e2960fa4ae0e963ca76380c54cd9 # v1.0.6

      # Under `--verbose`, the log of the job shows whether Otto publishes or
      # skips each crate, and each crate as crates.io accepts its upload.
      - name: Publish the crates
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token }}
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.event.release.tag_name }}
        run: otto --verbose publish-crates --tag "$TAG"

      # Each command of Otto writes its whole log to a file in the data
      # directory of the user, which is gone after the job. So a job that
      # failed keeps those files as an artifact. Each attempt of a re-run
      # uploads under a name of its own, because an artifact keeps its name
      # within a run of the workflow.
      - name: Keep the logs of Otto
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: otto-logs-${{ github.run_attempt }}
          path: ~/.local/share/otto/projects/
          if-no-files-found: ignore
