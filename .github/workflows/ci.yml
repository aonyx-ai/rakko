---
name: Continuous Integration

"on":
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  targets:
    name: Enumerate Just recipes
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      matrix: ${{ steps.export-targets.outputs.targets }}

    env:
      # This job lists the recipes, it does not run them, so it needs no tracey
      RAKKO_SKIP_TRACEY: "1"

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # Listing the recipes needs Just and jq, and nothing else. A cache would
      # hold a tool set that no other job wants, so this job writes none.
      - name: Install mise
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
        with:
          cache: false
          install_args: just jq

      - name: Export targets
        id: export-targets
        run: echo "targets=$(just --list | awk '/build-|check-|format-|lint-|test-/{print $1}' | jq -cnR '[inputs]')" >> "$GITHUB_OUTPUT"

  checks:
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    needs: targets

    env:
      # Only `just check-specs` calls tracey, and the mise task builds tracey
      # from source when the cache below misses. An empty value leaves that
      # build on, so every other recipe skips it.
      RAKKO_SKIP_TRACEY: ${{ matrix.target != 'check-specs' && '1' || '' }}

    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(needs.targets.outputs.matrix) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # `just check-specs` compares the pull request with its base branch,
          # which is the first parent of the merge commit
          fetch-depth: 2
          persist-credentials: false

      # A runner of GitHub starts from a clean disk, and the build of tracey
      # takes several minutes. The cache workflow keeps a cache on the default
      # branch that every pull request can reach.
      - name: Restore tracey
        if: env.RAKKO_SKIP_TRACEY == ''
        uses: ./.github/actions/restore-tracey

      - name: Install the tools
        uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0

      - name: Run check with Just
        env:
          TARGET: ${{ matrix.target }}
        run: just "$TARGET"

  success:
    name: All checks succeeded
    runs-on: ubuntu-latest

    permissions: {}

    needs: checks
    if: always()

    steps:
      - name: Check if all checks succeeded
        # `needs` is a list of job names, which themselves are generated from
        # the output of `just --list`, so we ignore the template injection here.
        # zizmor: ignore[template-injection]
        run: jq --exit-status 'all(.result == "success")' <<< '${{ toJson(needs) }}'
