---
name: Continuous Integration

"on":
  pull_request:
  workflow_dispatch:

permissions: {}

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  commands:
    name: Enumerate the commands
    runs-on: ubuntu-latest

    permissions:
      contents: read

    outputs:
      checks: ${{ steps.export-commands.outputs.checks }}
      tests: ${{ steps.export-commands.outputs.tests }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The setup cleans the tree itself, and keeps the build output that
          # an earlier job left on a persistent self-hosted runner.
          clean: false
          persist-credentials: false

      - name: Set up the tools
        uses: $/.github/actions/setup

      # The help of the harness lists what this repository mounts, so an
      # action that the harness gains reaches CI without a change to this
      # file. The prefix picks the commands that a job runs: `pre-commit`
      # drives the actions that the jobs below already run one by one, and
      # `help` is not a check. A written command that is a check therefore
      # has to carry one of these prefixes to reach CI.
      #
      # The list splits in two, because a command that runs the tests runs on
      # every platform and every other command runs on one.
      #
      # The help is text that clap lays out, and a release of clap may lay it
      # out differently. An empty list would skip a whole job and read as a
      # pull request that has nothing to run, so an empty one fails here.
      - name: Export the commands
        id: export-commands
        run: |
          listed=$(mise run rakko -- --help |
            awk '/^Commands:/ { list = 1; next }
                 /^$/         { list = 0 }
                 list && /^  (build|check|format|lint|test)-/ { print $1 }')

          checks=$(grep --invert-match '^test-' <<< "${listed}" || true)
          tests=$(grep '^test-' <<< "${listed}" || true)

          if [ -z "${checks}" ] || [ -z "${tests}" ]; then
            echo "The help of the harness listed no command for one of the jobs." >&2
            exit 1
          fi

          to_json() { jq --compact-output --null-input --raw-input '[inputs]'; }

          echo "checks=$(to_json <<< "${checks}")" >> "$GITHUB_OUTPUT"
          echo "tests=$(to_json <<< "${tests}")" >> "$GITHUB_OUTPUT"

  checks:
    name: ${{ matrix.command }}
    runs-on: ubuntu-latest

    permissions:
      contents: read

    needs: commands

    strategy:
      fail-fast: false
      matrix:
        command: ${{ fromJson(needs.commands.outputs.checks) }}

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The setup cleans the tree itself, and keeps the build output that
          # an earlier job left on a persistent self-hosted runner.
          clean: false
          persist-credentials: false

      - name: Set up the tools
        uses: $/.github/actions/setup

      # The task hands every argument to the harness untouched, and the harness
      # is what a contributor runs as well, so a job of CI and a machine of a
      # contributor answer the same question with the same command.
      - name: Run the command
        env:
          COMMAND: ${{ matrix.command }}
        run: mise run rakko -- "$COMMAND"

  # An action starts a subprocess and reads the paths that it reported, and
  # that is where an assumption about a platform shows up, so the commands
  # that run the tests run on every platform that Rakko supports. The tests
  # of each action start its tool on that platform, so the other commands
  # run on one platform only, which is why this job is separate from the
  # matrix above. Every platform of the matrix gates a merge, because a
  # platform that only reports is a platform that nobody fixes.
  tests:
    name: ${{ matrix.command }} on ${{ matrix.os }}
    runs-on: ${{ matrix.os }}

    permissions:
      contents: read

    needs: commands

    strategy:
      fail-fast: false
      matrix:
        command: ${{ fromJson(needs.commands.outputs.tests) }}
        os: [ubuntu-latest, macos-latest, windows-latest]

    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          # The setup cleans the tree itself, and keeps the build output that
          # an earlier job left on a persistent self-hosted runner.
          clean: false
          persist-credentials: false

      - name: Set up the tools
        uses: $/.github/actions/setup

      # PowerShell is the shell that a contributor on Windows types the
      # command into, so the leg on Windows runs the command the way that
      # contributor does. Every runner carries it, so one spelling of the
      # command serves the whole matrix. The default shell of a step on
      # Windows is PowerShell too, but it reads `$COMMAND` as a variable of its
      # own, so the step reads the variable of the environment.
      - name: Run the command
        shell: pwsh
        env:
          COMMAND: ${{ matrix.command }}
        run: mise run rakko -- $env:COMMAND

  success:
    name: All checks succeeded
    runs-on: ubuntu-latest

    permissions: {}

    needs: [checks, tests]
    if: always()

    steps:
      - name: Check if all checks succeeded
        # `needs` is a list of job names, which themselves are generated from
        # the help of the harness, so we ignore the template injection here.
        # zizmor: ignore[template-injection]
        run: jq --exit-status 'all(.result == "success")' <<< '${{ toJson(needs) }}'
