---
name: Set up the tools
description: Clean the checkout, install the tools that mise pins, and build tracey for a job that needs it

# Every job of every workflow provisions the same way, so the steps live here
# instead of once per job in each workflow. A job checks out the code with
# `clean: false` and runs this action next, because the first step below takes
# over the cleaning of the checkout.

inputs:
  tracey:
    description: Whether the job runs something that reaches tracey
    required: false
    default: "false"

runs:
  using: composite
  steps:
    # A persistent self-hosted runner holds the tree of its last job, and the
    # checkout used to remove everything in it that git does not track. Every
    # job then built the harness again, and every job of Rust built the
    # project from nothing. The step below removes the same files, except the
    # two directories that cargo builds in, so a job starts from the build
    # output of the jobs before. On a clean machine it removes nothing.
    - name: Remove what earlier jobs left in the tree
      shell: bash
      run: git clean -ffdx -e /target/ -e /tools/rakko/target/

    # A runner of GitHub starts from a clean disk, and the build of tracey
    # takes about twenty minutes. The cache workflow keeps a cache on the
    # default branch that every pull request can reach.
    - name: Restore tracey
      if: inputs.tracey == 'true'
      uses: $/.github/actions/restore-tracey

    # A runner of GitHub starts from a clean disk, and so does a runner that a
    # service starts for a single job. A persistent self-hosted runner keeps
    # its home directory between jobs, so the tools of the jobs before are
    # still there, and a restore of the cache only downloads them again. There
    # the restore took most of a short job, because the jobs that run at the
    # same time share one connection. The step below looks for the tools of an
    # earlier job, and the installation restores the cache only without them.
    - name: Look for the tools of an earlier job
      id: earlier
      shell: bash
      run: |
        set -euo pipefail

        if [ -n "${MISE_DATA_DIR:-}" ]; then
            data="${MISE_DATA_DIR}"
        elif [ "${RUNNER_OS}" = "Windows" ]; then
            data="${LOCALAPPDATA}/mise"
        else
            data="${HOME}/.local/share/mise"
        fi

        if [ -n "$(ls -A "${data}/installs" 2>/dev/null)" ]; then
            echo "found=true" >> "${GITHUB_OUTPUT}"
        else
            echo "found=false" >> "${GITHUB_OUTPUT}"
        fi

    # Tracey stays out of this installation even in a job that reaches it,
    # because a tool of the cargo backend builds without the other tools of
    # mise on its path, and the build script of tracey needs two of them. The
    # steps below build it with those two on the path instead.
    - name: Install the tools
      uses: jdx/mise-action@c2a87611a18de5b3828c5652fe268e992400cb5c # v4.3.0
      with:
        # Without a pin the action installs the release that mise reports as
        # the newest one, and a release whose upload failed carries no file to
        # download. Renovate advances the pin, so a release that breaks costs
        # one revert instead of a red pull request.
        # renovate: datasource=github-releases depName=jdx/mise extractVersion=^v(?<version>.+)$
        version: 2026.9.12
        cache: ${{ steps.earlier.outputs.found != 'true' }}
      env:
        MISE_DISABLE_TOOLS: cargo:https://github.com/bearcove/tracey

    # The build script of tracey starts node and pnpm by name, and it finds
    # neither through mise: a tool of the cargo backend builds without the
    # other tools of mise on its path. The directory below carries both under
    # names that belong to no tool of mise, so the build reaches the versions
    # that this repository pins. The versions that they print stop the job
    # here instead of after the nine minutes that the dependencies take.
    - name: Build tracey
      if: inputs.tracey == 'true'
      shell: bash
      env:
        MISE_DISABLE_TOOLS: ""
      run: |
        tools="${RUNNER_TEMP}/tracey-build-tools"
        mkdir -p "${tools}"
        ln -sf "$(mise where node)/bin/node" "${tools}/node"
        ln -sf "$(mise where pnpm)/pnpm" "${tools}/pnpm"
        export PATH="${tools}:${PATH}"

        node --version
        pnpm --version

        mise install "cargo:https://github.com/bearcove/tracey"

    # The installation runs the task that downloads the toolchains which mise
    # only recorded, but a failed task is only a warning there. The task runs
    # again here, where a failure stops the job instead of leaving a toolchain
    # for the first command that selects it to download.
    - name: Download the toolchains
      shell: bash
      run: mise run install-toolchains
