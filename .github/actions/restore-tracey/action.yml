---
name: Restore tracey
description: Restore the tracey binary that mise builds from source

# The workflows that need tracey share this action, so that the key and the
# path stay in one place. A key that differs between two workflows costs no
# error, only a cache that never hits.
runs:
  using: composite
  steps:
    # Mise builds the revision that `mise.toml` pins, so the revision is what
    # the cached binary depends on. A key that hashed the whole file would
    # rotate on every edit of it, and a reflowed comment would cost the
    # twenty-minute build.
    - name: Read the revision of tracey
      id: revision
      shell: bash
      run: |
        set -euo pipefail

        revision="$(grep 'bearcove/tracey' mise.toml | grep -o 'rev:[0-9a-f]\{40\}' | cut -d: -f2 || true)"
        if [ -z "${revision}" ]; then
            echo "mise.toml pins no revision of tracey" >&2
            exit 1
        fi

        echo "revision=${revision}" >> "${GITHUB_OUTPUT}"

    # Mise keeps what it installed below its data directory, which sits
    # somewhere else on Windows, and the cache has to restore into the
    # directory that mise reads afterwards.
    - name: Find the install directory of mise
      id: location
      shell: bash
      run: |
        set -euo pipefail

        if [ "${RUNNER_OS}" = "Windows" ]; then
            data="${LOCALAPPDATA}/mise"
        else
            data="${HOME}/.local/share/mise"
        fi

        echo "path=${data}/installs/cargo-https-github-com-bearcove-tracey" >> "${GITHUB_OUTPUT}"

    # The path is where the cargo backend of mise installs the tool. The
    # directory carries the revision below it, so a new pin asks for a new
    # build and the cache of the old one expires on its own.
    #
    # The key names that location, because a cache entry restores to the paths
    # it was saved from. An entry that a task wrote elsewhere would unpack
    # there, leave this directory empty, and still count as a hit, and a hit on
    # the key of an entry writes none, so every run would build tracey again.
    # Tracey is cached once per platform, so the platform is part of the key.
    - name: Restore tracey
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
      with:
        path: ${{ steps.location.outputs.path }}
        key: tracey-mise-${{ runner.os }}-${{ runner.arch }}-${{ steps.revision.outputs.revision }}
