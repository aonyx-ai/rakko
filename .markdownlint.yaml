---
# Long lines inside a code block or table cannot always wrap: a shell command, a
# directory tree, or a message meant to be copied verbatim has to stay on one
# line. Prose still wraps at 80.
MD013:
  code_blocks: false
  tables: false

# The same heading may appear under two different parents, e.g. "SIGTERM
# behavior" under both a design and an alternatives section.
MD024:
  siblings_only: true

# A page of the website shows the code of an example crate with the component
# `example` of Zola, which a page calls as `{{ <example ... /> }}`. That call
# reads as an HTML element to markdownlint. No HTML has an element of that
# name, so the exception allows no real HTML.
MD033:
  allowed_elements:
    - example
