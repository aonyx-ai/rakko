# Rakko generates this file from the tools that the actions of the harness
# declare. Do not edit it, because `mise run rakko -- doctor --fix` writes it
# again.

[tools]
"cargo:cargo-deny" = "0.21.0"
"cargo:cargo-nextest" = "0.9.152"
"cargo:cargo-udeps" = "0.1.61"
"npm:markdownlint-cli" = "0.50.0"
"npm:prettier" = "3.10.1"
"npm:renovate" = "44.240.0"
oxfmt = "0.75.0"
oxlint = "1.93.0"
shellcheck = "0.11.0"
shfmt = "3.14.1"
taplo = "0.10.0"
tflint = "0.66.0"
yamllint = "1.38.0"

[tools."github:aonyx-ai/stiles"]
version = "stiles@0.6.0"
os = ["linux", "macos/arm64"]

[tools.zizmor]
version = "1.32.0"
os = ["linux", "macos", "windows/x64"]
